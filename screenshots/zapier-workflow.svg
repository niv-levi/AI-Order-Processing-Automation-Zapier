<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1650" viewBox="0 0 1400 1650">
  <rect width="1400" height="1650" fill="#f7f8fa"/>
  <style>
    .title{font:700 38px Arial,sans-serif;fill:#111827}
    .sub{font:400 21px Arial,sans-serif;fill:#6b7280}
    .card{fill:#fff;stroke:#d1d5db;stroke-width:2}
    .step{font:700 20px Arial,sans-serif;fill:#111827}
    .desc{font:400 16px Arial,sans-serif;fill:#4b5563}
    .label{font:700 18px Arial,sans-serif}
    .small{font:400 15px Arial,sans-serif;fill:#4b5563}
    .arrow{stroke:#6366f1;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="700" y="65" text-anchor="middle" class="title">Zapier Workflow</text>
  <text x="700" y="100" text-anchor="middle" class="sub">Order processing from webhook to production or manual review</text>

  <g transform="translate(350,135)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">1. Webhook</text><text x="28" y="65" class="desc">Receive order data</text>
  </g>
  <path class="arrow" d="M700 225 L700 260"/>

  <g transform="translate(350,265)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">2. Loop Through Line Items</text><text x="28" y="65" class="desc">Process each item separately</text>
  </g>
  <path class="arrow" d="M700 355 L700 390"/>

  <g transform="translate(350,395)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">3. Build Unique Item Key</text><text x="28" y="65" class="desc">order_id + line_item_id</text>
  </g>
  <path class="arrow" d="M700 485 L700 520"/>

  <g transform="translate(350,525)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">4. Zapier Tables</text><text x="28" y="65" class="desc">Find or create the item record</text>
  </g>
  <path class="arrow" d="M700 615 L700 650"/>

  <g transform="translate(350,655)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">5. Duplicate Filter</text><text x="28" y="65" class="desc">Stop items that were already processed</text>
  </g>
  <path class="arrow" d="M700 745 L700 780"/>

  <g transform="translate(350,785)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">6. AI Extraction</text><text x="28" y="65" class="desc">Extract material, size, engraving and gift box</text>
  </g>
  <path class="arrow" d="M700 875 L700 910"/>

  <g transform="translate(350,915)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">7. Validation</text><text x="28" y="65" class="desc">Check required fields and confidence</text>
  </g>
  <path class="arrow" d="M700 1005 L700 1040"/>

  <g transform="translate(350,1045)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">8. Update Order Record</text><text x="28" y="65" class="desc">Save AI output and validation result</text>
  </g>
  <path class="arrow" d="M700 1135 L700 1170"/>

  <g transform="translate(350,1175)">
    <rect class="card" rx="18" width="700" height="90"/><text x="28" y="36" class="step">9. Paths</text><text x="28" y="65" class="desc">Route by validation status</text>
  </g>

  <path class="arrow" d="M700 1265 L700 1310 L350 1310 L350 1350"/>
  <path class="arrow" d="M700 1265 L700 1310 L1050 1310 L1050 1350"/>

  <g transform="translate(110,1355)">
    <rect rx="18" width="480" height="190" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="240" y="38" text-anchor="middle" class="label" fill="#047857">Ready for Production</text>
    <text x="28" y="82" class="step">ClickUp</text><text x="28" y="110" class="small">Create a production task</text>
    <text x="28" y="145" class="step">Final status</text><text x="28" y="173" class="small">task_created</text>
  </g>

  <g transform="translate(810,1355)">
    <rect rx="18" width="480" height="190" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="240" y="38" text-anchor="middle" class="label" fill="#1d4ed8">Needs Review</text>
    <text x="28" y="82" class="step">Slack</text><text x="28" y="110" class="small">Send missing details for human review</text>
    <text x="28" y="145" class="step">Final status</text><text x="28" y="173" class="small">review_notified</text>
  </g>

  <g transform="translate(350,1570)">
    <rect rx="14" width="700" height="52" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
    <text x="350" y="33" text-anchor="middle" class="label" fill="#b91c1c">AI / ClickUp / Slack error → status = failed</text>
  </g>
</svg>